<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pursuit — your job search command center. Track applications, run cold outreach, manage your network and see what actually works." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Pursuit — Job Search OS</title>
    <script>
      // Apply theme + accent before first paint (no flash).
      (function () {
        try {
          var t = localStorage.getItem('pursuit.theme') || 'system';
          var a = localStorage.getItem('pursuit.accent') || 'indigo';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          if (dark) r.classList.add('dark');
          r.setAttribute('data-accent', a);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
